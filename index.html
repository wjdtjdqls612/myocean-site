<!-- 브라우저 탭 아이콘 (별도 파일 없이 SVG로 내장) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070502'/><polygon points='23,16 31,10 31,22' fill='%23e0752e'/><ellipse cx='14' cy='16' rx='11' ry='6.4' fill='%23f2a655'/><circle cx='7.5' cy='14' r='1.3' fill='%232a1c08'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070502;
    --bg2:#150d06;
    --amber:#f2a655;
    --amber2:#e08a3d;
    --gold:#ffdf9e;
    --rust:#9a5326;
    --dust:#e9caa0;
    --paper:#f8efdd;
    --ink:#2a2016;
    --muted:#b8a688;
    --line: rgba(242,166,85,.28);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:#f3e9d8;
    font-family:'Cormorant Garamond','Nanum Myeongjo',serif;
    min-height:100vh; position:relative; overflow-x:hidden;
    word-break:keep-all; overflow-wrap:break-word;
  }

  /* ---- 페이지 상단 노을빛 ----
     히어로 하단의 따뜻한 색이 배경으로 자연스럽게 이어지도록 위에 한 겹 얹음.
     배경색 변수(--bg, --bg2)는 그대로 두고 레이어만 추가.
     fixed가 아니라 absolute라서 스크롤하면 함께 올라가 사라짐
     (.sunbeam은 fixed라 계속 남지만, 이 겹은 상단에만 머물러야 함).
     z-index는 .content(2)보다 아래 */
  body::before{
    content:''; position:absolute; z-index:0; pointer-events:none;
    top:0; left:0; right:0; height:158vh;
    background:linear-gradient(180deg,
      rgba(242,166,85,.20) 0%,
      rgba(242,166,85,.13) 16%,
      rgba(154,83,38,.11)  40%,
      rgba(154,83,38,.05)  68%,
      rgba(154,83,38,0)    100%);
  }

  /* ---- 대각선 햇살 + 먼지 입자 ---- */
  .sunbeam{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 30%, rgba(242,166,85,.10) 42%, transparent 54%),
      linear-gradient(115deg, transparent 55%, rgba(255,223,158,.06) 65%, transparent 75%),
      radial-gradient(ellipse at 15% -10%, rgba(242,166,85,.22), transparent 55%);
  }
  .dust{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .mote{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--dust); opacity:.55; animation:rise linear infinite; }
  @keyframes rise{ from{ transform:translateY(0); opacity:0;} 10%{opacity:.6;} to{ transform:translateY(-100vh); opacity:0;} }

  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .content{ position:relative; z-index:2; }
  .wrap{ max-width:540px; margin:0 auto; padding: clamp(40px,8vw,56px) clamp(16px,5vw,22px) 90px; }

  /* ===== 타이포 위계 3단 =====
     1단 h1(제목) / 2단 .intro(본문) / 3단 .eyebrow·.about-note·.tank-count(보조)
     각 단의 크기 차이를 크게 벌려 시선이 머물 지점을 명확히 함 */

  /* 3단: 보조. 아이브로는 화면당 1개(제목 위 MY OCEAN)만 사용 */
  .eyebrow{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; margin-bottom:12px; }

  /* 1단: 제목. 포스터와 동일한 단색 흰색.
     그라디언트 배경클립을 제거해 구형 브라우저에서 글자가 사라지는 위험도 함께 해소 */
  h1{
    font-family:'Cormorant Garamond','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(40px,12vw,58px); line-height:1.1; letter-spacing:-.01em;
    margin:0 0 18px; text-wrap:balance;
    color:#fff8ec;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }

  /* ===== 히어로 =====
     넓은 화면에서는 .wrap의 좌우 패딩만큼만 바깥으로 빼내 컬럼 폭(540px)에 맞춤.
     예전처럼 100vw로 펼치면 박스가 납작해지고(1440px에서 1440x522) cover가
     가로를 채우려 확대하면서 세로가 대부분 잘려, 창문·바다·노을이 전부 사라졌음.
     폭을 540px로 묶으면 넓은 화면에서도 폰과 같은 비율이 되어 창문이 보임 */
  .hero{
    position:relative;
    margin:0 calc(-1 * clamp(16px,5vw,22px)) 34px;
    overflow:hidden;
  }
  /* 좁은 화면에서만 화면 끝까지 닿게(full-bleed).
     이때는 박스가 세로로 충분히 길어 잘림 문제가 없음.
     body에 overflow-x:hidden이 있어 100vw로 인한 가로 스크롤은 생기지 않음 */
  @media (max-width:600px){
    .hero{
      width:100vw; max-width:none;
      margin-left:50%; margin-right:0;
      transform:translateX(-50%);
      margin-top:calc(-1 * clamp(40px,8vw,56px));
    }
  }
  /* 9:16을 그대로 쓰면 폰에서 690px이 되어 어항과 폼이 첫 화면에서 밀려남.
     58vh로 잘라내고, 잘리는 쪽은 아래(나무 바닥·화분)가 되도록 위쪽을 살림 */
  .hero-img{
    display:block; width:100%; height:auto;
    max-height:58vh;
    object-fit:cover;
    object-position:50% 5%;
    /* 검은 막으로 덮는 대신 이미지 자체를 아래로 갈수록 투명하게 만듦.
       .content에 배경이 없어서, 뚫린 자리에는 페이지 배경과 그 위의
       body::before 노을빛이 그대로 드러남. 색을 맞출 필요 없이
       구조적으로 같은 면이 되므로 경계선이 생기지 않음.
       마스크는 .hero-img에만 적용. .hero에 걸면 제목까지 흐려짐 */
    -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 55%, transparent 100%);
            mask-image:linear-gradient(180deg, #000 0%, #000 55%, transparent 100%);
    -webkit-mask-size:100% 100%;
            mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat;
            mask-repeat:no-repeat;
  }
  /* 마스크를 지원하지 않는 브라우저에서만 예전 방식의 하단 페이드를 되살림.
       표준·웹킷 접두사 어느 쪽도 지원하지 않을 때만 걸리므로,
       마스크가 적용되는 브라우저에서 두 겹이 겹쳐 어두워지는 일은 없음 */
  @supports not ((mask-image: linear-gradient(#000, transparent)) or (-webkit-mask-image: linear-gradient(#000, transparent))){
    .hero{ background:#0b0703; }
    .hero::after{
      content:''; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(180deg,
        rgba(7,5,2,0)    46%,
        rgba(7,5,2,.18)  62%,
        rgba(7,5,2,.45)  76%,
        rgba(7,5,2,.75)  88%,
        rgba(7,5,2,.93)  96%,
        #070502          100%);
    }
  }
  /* 제목이 놓이는 상단 구간만 어둡게 덮는 한 겹.
     이미지 상단 0~10%는 어둡고 고르지만(평균 47), 바로 아래 10~20%는
     밝고 편차가 커서(평균 87) 제목이 그 위까지 내려오면 읽히지 않음.
     제목 블록 전체를 덮을 만큼만 깔고 그 아래는 자연스럽게 사라지게 함 */
  .hero-veil{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg,
      rgba(4,3,1,.80) 0%,
      rgba(4,3,1,.62) 12%,
      rgba(4,3,1,.32) 26%,
      rgba(4,3,1,.10) 36%,
      transparent 46%);
  }
  /* 좌우 패딩을 .wrap과 같은 clamp(16px,5vw,22px)로 맞췄기 때문에,
     넓은 화면(히어로 폭 540px)에서는 제목이 아래 전시정보와 정확히 같은 선에서
     시작하고, 좁은 화면(히어로 폭 100vw)에서도 본문 컬럼과 어긋나지 않음 */
  .hero-text{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:540px;
    padding: clamp(20px,5vw,32px) clamp(16px,5vw,22px) 0;
    box-sizing:border-box;
  }
  .hero-text .eyebrow{ color:rgba(255,248,236,.82); margin-bottom:10px; }
  .hero-text h1{ margin:0; text-shadow:0 2px 20px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,.6); }

  /* ===== 전시 정보 ===== */
  /* 히어로 아래가 검은 면적만 크고 비어 보여, 상하 패딩과 행 간격을 줄여
     밀도를 높임. 글자 크기(라벨 12px / 값 17px)와 색은 그대로 */
  .exhibit-info{
    margin:0 0 30px; padding:12px 0 13px;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .exhibit-info dl{ margin:0; }
  .exhibit-info .row{ display:flex; align-items:baseline; gap:14px; padding:3px 0; }
  .exhibit-info dt{ flex:0 0 52px; font-size:12px; color:var(--muted); letter-spacing:.02em; }
  .exhibit-info dd{
    margin:0; flex:1 1 auto;
    font-family:'Cormorant Garamond','Nanum Myeongjo',serif;
    font-size:17px; line-height:1.45; color:var(--gold);
  }
  .exhibit-info dd .sub{ display:block; font-size:13px; color:#e2d3ba; margin-top:2px; }
  @media (max-width:360px){
    .exhibit-info .row{ flex-direction:column; gap:2px; }
    .exhibit-info dt{ flex:none; }
  }

  /* 2단: 본문 */
  .intro{
    font-size:17px; line-height:1.75; color:#e2d3ba;
    margin:0 0 44px; padding-left:16px; border-left:1px solid var(--line);
  }
  .intro p{ margin:0 0 10px; }
  .intro p:last-child{ margin-bottom:0; }

  /* 3단: About 박스 */
  .about-note{
    position:relative; font-size:14px; line-height:1.7; color:#e2d3ba;
    background:linear-gradient(135deg, rgba(242,166,85,.11), rgba(242,166,85,.02));
    border:1px solid rgba(242,166,85,.22); border-radius:6px;
    padding:18px 20px 17px; margin:0 0 44px;
  }
  /* 대문자 + 넓은 자간 라벨을 제거하고 일반 소제목으로 변경.
     아이브로는 제목 위 하나로 통일했으므로 여기서는 아이브로로 취급하지 않음 */
  .about-note .note-label{
    font-size:13px; color:var(--gold); margin:0 0 9px;
    font-family:'Cormorant Garamond','Nanum Myeongjo',serif;
  }
  .about-note p{ margin:0 0 7px; }
  .about-note p:last-child{ margin-bottom:0; }

  .video-card{
    position:relative; border-radius:4px; overflow:hidden; margin-bottom:50px;
    padding:1px; background:linear-gradient(135deg, var(--gold), var(--amber2), var(--rust));
    box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
  }
  .video-inner{ border-radius:3px; overflow:hidden; background:#0a0603; }
  .video-frame{ position:relative; width:100%; padding-top:56.25%; }
  .video-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--muted); text-align:center; padding:0 20px;
    background:radial-gradient(circle at 50% 40%, rgba(242,166,85,.14), transparent 70%);
  }
  .video-empty .tag{ font-family:'Cormorant Garamond','Nanum Myeongjo',serif; font-size:16px; color:var(--gold); }
  .video-empty .sub{ font-size:12.5px; }

  /* ---- 어항 (참고 이미지 기반: 직사각형 유리 어항 + 성 + 물고기) ---- */
  .tank-section{ text-align:center; margin-bottom:52px; }
  .tank-title{ font-family:'Cormorant Garamond','Nanum Myeongjo',serif; font-size:19px; color:var(--gold); margin-bottom:2px; letter-spacing:.01em; }
  .tank-count{ color:var(--muted); font-size:12.5px; margin-bottom:24px; }

  .tank{ width:100%; max-width:520px; margin:0 auto; position:relative; }
  .tank-rim-top, .tank-rim-bottom{
    height:12px; background:linear-gradient(180deg,#c98a4e,#6b4423);
    border-radius:2px; box-shadow:0 1px 0 rgba(255,223,158,.35) inset;
  }
  .tank-rim-bottom{ height:17px; }
  .tank-glass{
    position:relative; height:clamp(200px, 58vw, 300px); overflow:hidden;
    background:linear-gradient(180deg, rgba(242,166,85,.16), rgba(154,83,38,.22) 55%, rgba(20,12,5,.5));
    border-left:2px solid rgba(255,223,158,.45); border-right:2px solid rgba(255,223,158,.45);
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 20px 40px -10px rgba(0,0,0,.7);
  }
  .tank-glow{ position:absolute; inset:0; background:radial-gradient(ellipse 60% 50% at 20% 15%, rgba(255,223,158,.30), transparent 65%); }

  .castle-img{
    position:absolute; left:6%; bottom:0;
    height:53%; width:auto; max-width:45%; object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45)) sepia(.15) saturate(1.05);
  }
  .fish-layer{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
  }
  .fish{
    position:absolute;
    cursor:pointer; pointer-events:auto;
    background:none; border:0; padding:0;
    animation: swim var(--dur,24s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .fish:focus-visible{
    outline:2px solid var(--gold); outline-offset:3px; border-radius:50%;
  }

  /* ---- 어항 확대 보기 ---- */
  .tank{ cursor:zoom-in; }
  .tank-hint{
    text-align:center; font-size:12px; color:var(--muted);
    margin-top:8px; letter-spacing:.02em;
  }
  .visit-count{
    text-align:center; font-size:12px; color:var(--muted); margin-top:4px;
  }

  .tank-modal{
    position:fixed; inset:0; z-index:40;
    /* 완전 불투명. 이전에는 .94~.97이라 뒷 페이지가 비쳐 보였음 */
    background:linear-gradient(180deg, #070502, #150d06);
    display:flex; flex-direction:column; padding:14px;
  }
  .tank-modal-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:10px; flex:0 0 auto;
  }
  .tank-modal-title{ font-size:15px; color:var(--dust); }
  .tank-modal-close{
    font:inherit; cursor:pointer; padding:8px 14px; border-radius:8px;
    border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--gold);
  }
  /* 화면 세로를 전부 채우면 협곡처럼 길어지므로 가로세로비를 기본 어항과
     비슷하게 제한하고, 남는 공간은 위아래 여백으로 두어 세로 중앙 정렬.
     배경도 불투명 색 위에 얹어 뒷 페이지가 비치지 않게 함 */
  .tank-modal-body{
    /* flex-grow는 0이어야 함. 1이면 남은 세로 공간을 전부 흡수해서
       아래 aspect-ratio로 계산한 높이를 덮어쓰고, margin:auto가 가져갈
       여유 공간도 사라져 세로 중앙 정렬까지 무효가 됨 */
    flex:0 1 auto; position:relative; overflow:hidden; border-radius:10px;
    border:1px solid var(--line);
    width:100%; max-width:min(100%, calc((100vh - 120px) * 1.7));
    aspect-ratio: 1.7 / 1;
    max-height:100%;
    margin:auto;
    background-color:#120b05;
    background-image:linear-gradient(180deg, rgba(242,166,85,.16), rgba(154,83,38,.22) 55%, rgba(20,12,5,.5));
  }
  /* aspect-ratio 미지원 브라우저를 위한 대비: 비율 제한이 없으면 높이만 제한 */
  @supports not (aspect-ratio: 1.7 / 1){
    .tank-modal-body{ height:min(100%, 58vh); }
  }
  .tank-modal-body .fish-layer{ pointer-events:none; }
  .tank-modal-body .castle-img{
    left:5%; bottom:0; height:46%; max-width:42%;
  }
  .tank-modal-body .tank-glow{ position:absolute; inset:0; pointer-events:none; }

  /* 확대 화면의 물고기: 바깥(wrap)은 이동만, 안쪽(body)만 좌우 반전.
     이렇게 나눠야 이름표가 같이 뒤집혀 거울글씨가 되는 것을 막을 수 있음. */
  .fish-wrap{
    position:absolute; pointer-events:auto; cursor:pointer;

const firebaseConfig = {

(function initDust(){

function withTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const timer = setTimeout(()=> reject(new Error('request-timeout')), ms);
    promise.then(
      (v)=>{ clearTimeout(timer); resolve(v); },
      (e)=>{ clearTimeout(timer); reject(e); }
    );
  });
}

// 관리자(로그인) 화면용: 로그인 상태에서는 보안규칙상 모든 문서를 읽을 수 있으므로
// 대기/승인/거절 전체 목록이 필요한 관리자 패널에서만 이 함수를 사용
async function loadAllMessagesForAdmin(){
  try{
    const snap = await withTimeout(getDocs(collection(db, MESSAGES_COL)), 10000);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(e){ return []; }
}
async function addMessage(name, text){
  await withTimeout(
    addDoc(collection(db, MESSAGES_COL), { name, text, status:'pending', ts: Date.now() }),
    10000
  );
}
async function setMessageStatus(id, status){
  await withTimeout(updateDoc(doc(db, MESSAGES_COL, id), { status }), 10000);
}
async function removeMessage(id){
  await withTimeout(deleteDoc(doc(db, MESSAGES_COL, id)), 10000);
}
function escapeHtml(s){
  // 값이 비어있거나 문자열이 아닌 문서가 섞여 있어도 화면 전체가 깨지지 않도록 방어
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(title, message){
  const overlay = document.createElement('div');
  overlay.className = 'toast-overlay';
  overlay.innerHTML = `
    <div class="toast-box">
      <div class="tag">${escapeHtml(title)}</div>
      <p>${escapeHtml(message)}</p>
      <button type="button" class="toast-close">확인</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('.toast-close').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
}

function showConfirm(title, message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'toast-overlay';
  overlay.innerHTML = `
    <div class="toast-box">
      <div class="tag">${escapeHtml(title)}</div>

      <div style="display:flex; gap:8px;">

        <button type="button" class="toast-close" id="confirmOkBtn" style="flex:1; background:#8a2f2f;">삭제</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#confirmCancelBtn').addEventListener('click', close);
  overlay.querySelector('#confirmOkBtn').addEventListener('click', ()=>{ close(); onConfirm(); });
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

            <div class="fish-layer" id="notesLayer"></div>

  `;

  const textEl = document.getElementById('text');
  const lenEl = document.getElementById('len');
  textEl.addEventListener('input', ()=>{ lenEl.textContent = textEl.value.length; });

  document.getElementById('submitBtn').addEventListener('click', async (e)=>{
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const name = document.getElementById('name').value.trim();
    const text = textEl.value.trim();

    if(!text){
      statusMsg.textContent = '메시지를 입력해주세요.';
      statusMsg.className = 'status-msg err';
      showToast('메시지가 비어있어요.', '응원 메시지 칸에 내용을 입력한 뒤 다시 눌러주세요.');
      return;
    }

    // 도배 방지: 같은 기기에서 너무 짧은 간격으로 연속 전송하는 것을 막음.
    // (Firestore 보안규칙이 create를 모두 허용하고 있어 서버 쪽 차단 수단이 없으므로
    //  최소한의 클라이언트 방어선. 전시 중 장난성 도배로 쓰기 할당량이 소진되는 것도 예방)
    try{
      const last = Number(localStorage.getItem('myocean_last_submit') || 0);
      const waitMs = SUBMIT_COOLDOWN_MS - (Date.now() - last);
      if(waitMs > 0){
        const sec = Math.ceil(waitMs/1000);
        statusMsg.textContent = `${sec}초 후에 다시 남길 수 있어요.`;
        statusMsg.className = 'status-msg err';
        showToast('잠시만요.', `마음을 담아 적어주신 만큼, ${sec}초 뒤에 한 번 더 남겨주세요.`);
        return;
      }
    }catch(e){ /* 시크릿 모드 등 localStorage 차단 환경에서는 그냥 통과 */ }

    btn.disabled = true; statusMsg.textContent=''; statusMsg.className='status-msg';
    showToast('전송 중이에요…', '잠시만 기다려주세요.');

    try{
      await addMessage(name || '익명', text);
      try{ localStorage.setItem('myocean_last_submit', String(Date.now())); }catch(e){}

      statusMsg.textContent = '전달됐어요. 확인 후 어항에 담길 거예요.';
      statusMsg.className = 'status-msg ok';
      document.getElementById('msgForm').reset();
      lenEl.textContent = '0';
      showToast('마음이 잘 전달됐어요.', '내용을 확인한 뒤 어항 속에 담길 거예요.');
    }catch(err){
      statusMsg.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
      statusMsg.className = 'status-msg err';
      showToast('전송에 실패했어요.', '혹시 화면에 저장 관련 확인창이 떴다면 확인을 눌러주세요. 계속 실패하면 새로고침 후 다시 시도해주세요.');
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('adminLink').addEventListener('click', (e)=>{
    e.preventDefault();
    renderAdmin();
  });

  const tankBox = document.getElementById('tankBox');
  if(tankBox){
    tankBox.addEventListener('click', openTankModal);
    tankBox.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openTankModal(); }
    });
  }

  subscribeTank();
  trackVisit();
}

// 물고기 색상 팔레트 (5종): 주황 / 파랑 / 보라 / 은색 / 오팔
const FISH_PALETTES = {
  orange: { tail: '#e0752e', body: '#f4a656' },
  blue:   { tail: '#3d6fa8', body: '#5b8fc9' },
  purple: { tail: '#7a4fa0', body: '#9a6fc2' },
  silver: { tail: '#a9acb8', body: '#d7d9e2' },
};
const FISH_COLOR_KEYS = ['orange','blue','purple','silver','opal'];

// 문자열을 안정적인 정수 해시로 변환 (메시지 id 기준으로 색을 고정하기 위함)
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function colorKeyForId(id){
  return FISH_COLOR_KEYS[hashStr(String(id)) % FISH_COLOR_KEYS.length];
}

function fishSvgFor(colorKey, uid){
  if(colorKey === 'opal'){
    const gid = 'opalGrad' + uid;
    return `
      <svg viewBox="0 0 32 18" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f6c9e0"/>
            <stop offset="35%" stop-color="#c9a6f2"/>
            <stop offset="65%" stop-color="#9fd8e6"/>
            <stop offset="100%" stop-color="#ffe6b8"/>
          </linearGradient>
        </defs>
        <polygon points="22,9 32,2 32,16" fill="url(#${gid})"/>
        <ellipse cx="13" cy="9" rx="11" ry="6.4" fill="url(#${gid})"/>
        <ellipse cx="13" cy="9" rx="11" ry="6.4" fill="#f2a655" opacity="0.12"/>
        <circle cx="6.5" cy="7" r="1.15" fill="#2a1c08"/>
      </svg>
    `;
  }
  const p = FISH_PALETTES[colorKey] || FISH_PALETTES.orange;
  return `
    <svg viewBox="0 0 32 18" xmlns="http://www.w3.org/2000/svg">
      <polygon points="22,9 32,2 32,16" fill="${p.tail}"/>
      <ellipse cx="13" cy="9" rx="11" ry="6.4" fill="${p.body}"/>
      <ellipse cx="13" cy="9" rx="11" ry="6.4" fill="#f2a655" opacity="0.12"/>
      <circle cx="6.5" cy="7" r="1.15" fill="#2a1c08"/>
    </svg>
  `;
}

// 어항에 표시할 승인 메시지 목록(실시간 리스너가 채워줌)
let tankMessages = [];
let unsubscribeTank = null;

// Firestore 실시간 리스너 구독.
// 기존에는 6초마다 전체 컬렉션을 다시 읽는 방식(setInterval + getDocs)이었는데,
// 그 방식은 접속자 1명당 6초마다 '승인 메시지 전체 개수'만큼 읽기가 발생해서
// 전시장에서 관람객이 몰리면 Firebase 무료 할당량(하루 5만 읽기)이 수 분 만에
// 소진되고, 그 이후 하루 종일 어항이 비어 보이게 됨.
// onSnapshot은 최초 1회만 전체를 읽고 이후에는 '변경된 문서'만 전송받으므로
// 읽기량이 수백 분의 1로 줄고, 승인하는 즉시 물고기가 나타나는 장점도 있음.
function subscribeTank(){
  if(unsubscribeTank) return; // 중복 구독 방지
  const q = query(collection(db, MESSAGES_COL), where('status','==','approved'));
  unsubscribeTank = onSnapshot(q,
    (snap)=>{
      tankMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTank();
      if(tankModalEl) renderModalFish();
    },
    ()=>{ renderTankError(); }
  );
}
function unsubscribeTankIfAny(){
  if(unsubscribeTank){ unsubscribeTank(); unsubscribeTank = null; }
}

// 네트워크 오류 등으로 불러오지 못했을 때, 조용히 빈 어항을 보여주지 않고
// 상황을 알려줌 (예전에는 실패해도 그냥 빈 화면이라 원인 파악이 어려웠음)
function renderTankError(){
  const countEl = document.getElementById('tankCount');
  if(countEl) countEl.textContent = '연결이 불안정해요. 잠시 후 다시 시도해주세요.';
}

function renderTank(){
  const layer = document.getElementById('notesLayer');
  const countEl = document.getElementById('tankCount');
  if(!layer) return;

  const all = tankMessages.slice().sort((a,b)=>a.ts-b.ts);
  if(countEl) countEl.textContent = all.length + '개의 마음이 도착했어요';

  // 성능 보호: 승인 메시지가 아주 많아져도 화면에 띄우는 물고기 수에는 상한을 둠.
  // (개수 표시는 위에서 전체 기준으로 이미 반영됨)
  const approved = all.slice(-MAX_FISH_ON_SCREEN);

  const approvedIds = new Set(approved.map(m=>String(m.id)));

  // 더 이상 승인 상태가 아닌(거절/삭제된) 물고기만 제거
  layer.querySelectorAll('.fish').forEach(el=>{
    if(!approvedIds.has(el.dataset.id)) el.remove();
  });

  // 이미 어항에 떠 있는 물고기는 절대 다시 만들지 않음(애니메이션이 끊기지 않도록)
  // -> 새로 승인된 메시지에 대해서만 새 물고기를 추가
  const existingIds = new Set(
    Array.from(layer.querySelectorAll('.fish')).map(el=>el.dataset.id)
  );

  // 어항(fish-layer)의 실제 렌더링 크기를 측정 — 화면 크기와 무관하게
  // 물고기 이동 범위를 이 크기에 맞춰 계산해서 탱크 밖으로 못 나가게 함
  const rect = layer.getBoundingClientRect();
  const boxW = rect.width  > 0 ? rect.width  : 300;
  const boxH = rect.height > 0 ? rect.height : 190;
  const marginX = 8;  // 좌우 여백(px)
  const marginY = 6;  // 상하 여백(px)

  approved.forEach(m=>{
    const idStr = String(m.id);
    if(existingIds.has(idStr)) return; // 이미 떠 있는 물고기는 건드리지 않음

    const dur = (55 + Math.random()*30).toFixed(1);
    const delay = (-(Math.random()*dur)).toFixed(1);
    const w = (16 + Math.random()*10);
    const h = w*0.56;

    // 가로: 시작점(startLeft)에서 오른쪽 한계(maxRight)까지의 실제 이동 가능 거리만큼만 dx로 사용
    // -> 어떤 화면 폭에서도 물고기가 오른쪽 여백을 넘어가지 않음
    const startLeft = marginX;
    const maxRight = Math.max(startLeft + 20, boxW - marginX - w);
    const dx = maxRight - startLeft;

    // 세로: top(기준 위치)을 잡고, 위/아래로 흔들리는 폭(dy)이 그 기준 위치의
    // 남은 여유 공간을 절대 넘지 않도록 계산 (스윙 키프레임의 최대 배수는 0.55)
    const topMin = marginY;
    const topMax = Math.max(topMin, boxH - h - marginY);
    const top = topMin + Math.random()*(topMax - topMin);
    const upSpace = top - topMin;
    const downSpace = topMax - top;
    const dyMax = Math.max(4, Math.min(upSpace, downSpace) / 0.6);
    const dy = Math.min(dyMax, 6 + Math.random()*14);

    const colorKey = colorKeyForId(m.id);

    // div 대신 button으로 만들어 키보드(Tab/Enter)와 스크린리더로도 열 수 있게 함
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fish';
    el.dataset.id = idStr;
    el.title = '눌러서 메시지 보기';
    el.setAttribute('aria-label', `${m.name || '익명'}님이 남긴 응원 메시지 보기`);
    el.style.left = startLeft.toFixed(1) + 'px';
    el.style.top = top.toFixed(1) + 'px';
    el.style.width = w.toFixed(1) + 'px';
    el.style.height = h.toFixed(1) + 'px';
    el.style.setProperty('--dur', dur + 's');
    el.style.setProperty('--delay', delay + 's');
    el.style.setProperty('--dx', dx.toFixed(1) + 'px');
    el.style.setProperty('--dy', dy.toFixed(1) + 'px');
    el.innerHTML = fishSvgFor(colorKey, idStr);
    el.addEventListener('click', ()=>{
      showToast(m.name || '익명', m.text);
    });
    layer.appendChild(el);
  });
}

// 저장된 로그인 세션 복원이 끝날 때까지 기다렸다가 현재 사용자를 돌려줌
let authReadyPromise = null;
function waitForAuthReady(){
  if(auth.currentUser) return Promise.resolve(auth.currentUser);
  if(!authReadyPromise){
    authReadyPromise = new Promise(resolve=>{
      const stop = onAuthStateChanged(auth, (u)=>{ stop(); resolve(u); });
    });
  }
  return authReadyPromise;
}

async function renderAdmin(){

  unsubscribeTankIfAny();

  // Firebase는 페이지가 열린 직후 저장된 로그인 세션을 '비동기로' 복원한다.
  // 그래서 #admin 주소로 새로고침하면 이 시점의 auth.currentUser가 아직 null이라
  // 이미 로그인돼 있는데도 로그인 화면이 잠깐(또는 계속) 뜨는 문제가 있었음.

// ===================== 어항 확대 보기 =====================
// 작은 어항에서는 물고기가 작아 누르기 어렵고 이름도 보이지 않음.
// 어항을 누르면 전체 화면으로 키워 물고기를 크게 보여주고,
// 이 화면에서만 작성자 이름표가 물고기를 따라다니게 함.
let tankModalEl = null;

function openTankModal(){
  if(tankModalEl) return;
  tankModalEl = document.createElement('div');
  tankModalEl.className = 'tank-modal';
  tankModalEl.innerHTML = `
    <div class="tank-modal-head">

      <button type="button" class="tank-modal-close" id="modalClose">닫기</button>

function escCloseModal(e){ if(e.key === 'Escape') closeTankModal(); }
function closeTankModal(){
  if(!tankModalEl) return;
  document.removeEventListener('keydown', escCloseModal);
  tankModalEl.remove();
  tankModalEl = null;
}

function renderModalFish(){
  const layer = document.getElementById('modalFishLayer');
  if(!layer) return;

  const all = tankMessages.slice().sort((a,b)=>a.ts-b.ts);
  const titleEl = document.getElementById('modalTitle');
  if(titleEl) titleEl.textContent = `쌓여가는 응원 · ${all.length}개`;

  const shown = all.slice(-MAX_FISH_ON_SCREEN);
  const shownIds = new Set(shown.map(m=>String(m.id)));

  layer.querySelectorAll('.fish-wrap').forEach(el=>{
    if(!shownIds.has(el.dataset.id)) el.remove();
  });
  const existing = new Set(Array.from(layer.querySelectorAll('.fish-wrap')).map(el=>el.dataset.id));

  const rect = layer.getBoundingClientRect();
  const boxW = rect.width  > 0 ? rect.width  : 320;
  const boxH = rect.height > 0 ? rect.height : 420;
  const marginX = 10;
  const marginY = 26; // 이름표가 위로 올라가므로 위쪽 여백을 넉넉히

  shown.forEach(m=>{
    const idStr = String(m.id);
    if(existing.has(idStr)) return;

    const dur = (55 + Math.random()*30).toFixed(1);

    const w = 30 + Math.random()*16;   // 기본 어항이 커진 만큼 확대 배율을 낮춤
    const h = w*0.56;

    const startLeft = marginX;
    const maxRight = Math.max(startLeft + 30, boxW - marginX - w);
    const dx = maxRight - startLeft;

    const topMin = marginY;
    const topMax = Math.max(topMin, boxH - h - marginY);
    const top = topMin + Math.random()*(topMax - topMin);
    const dyMax = Math.max(6, Math.min(top - topMin, topMax - top) / 0.6);
    const dy = Math.min(dyMax, 10 + Math.random()*22);

    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'fish-wrap';
    el.dataset.id = idStr;
    const who = m.name || '익명';

    el.style.left = startLeft.toFixed(1) + 'px';
    el.style.top = top.toFixed(1) + 'px';
    el.style.width = w.toFixed(1) + 'px';
    el.style.height = h.toFixed(1) + 'px';
    el.style.setProperty('--dur', dur + 's');
    el.style.setProperty('--delay', delay + 's');
    el.style.setProperty('--dx', dx.toFixed(1) + 'px');
    el.style.setProperty('--dy', dy.toFixed(1) + 'px');
    el.innerHTML =
      `<span class="fish-label">${escapeHtml(who)}</span>` +
      `<span class="fish-body">${fishSvgFor(colorKeyForId(m.id), idStr)}</span>`;
    el.addEventListener('click', ()=> showToast(who, m.text));
    layer.appendChild(el);
  });
}

// ===================== 방문자 수 =====================
// 같은 기기는 하루 한 번만 집계해서, 새로고침할 때마다 숫자가 튀지 않게 함.
async function trackVisit(){
  const el = document.getElementById('visitCount');
  const ref = doc(db, 'stats', 'visitors');
  let alreadyToday = false;
  try{
    const today = new Date().toISOString().slice(0,10);
    alreadyToday = localStorage.getItem('myocean_visit_day') === today;
    if(!alreadyToday) localStorage.setItem('myocean_visit_day', today);
  }catch(e){ alreadyToday = true; } // localStorage 차단 환경에서는 집계만 생략

  try{
    if(!alreadyToday){
      await withTimeout(setDoc(ref, { count: increment(1) }, { merge:true }), 8000);
    }
    const snap = await withTimeout(getDoc(ref), 8000);
    const n = snap.exists() ? (snap.data().count || 0) : 0;
    if(el && n > 0) el.textContent = `지금까지 ${n.toLocaleString('ko-KR')}명이 다녀갔어요`;
  }catch(e){
    // 보안 규칙 미적용 등으로 실패하면 조용히 숨김 (관람 흐름을 막지 않음)
  }
}

// ===================== 관리자 실시간 알림 =====================
// 전시장에서 성빈님이 휴대폰을 들고 있는 동안, 새 메시지가 올라오면
// 소리 + 진동 + 배지로 즉시 알려주고 바로 승인할 수 있게 하기 위한 기능.
// (Firestore 실시간 리스너를 쓰므로 새로고침이 필요 없음)

let alertSoundOn = false;   // 사용자가 버튼을 눌러야 켜짐(브라우저 자동재생 정책상 필수)
let audioCtx = null;
let wakeLock = null;
let adminUnsub = null;
let knownPendingIds = null; // 최초 로딩분은 '새 메시지'로 치지 않기 위한 기준
let newlyArrived = new Set();

// 오디오 파일 없이 코드로 알림음을 생성 (추가 파일 업로드 불필요, 데이터 사용량 0)
function playChime(){
  if(!alertSoundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i*0.18);
      gain.gain.exponentialRampToValueAtTime(0.35, now + i*0.18 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.18 + 0.32);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i*0.18);
      osc.stop(now + i*0.18 + 0.35);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([120, 60, 120]); }catch(e){}
}

// 브라우저 알림(다른 앱을 보고 있어도 뜸). 안드로이드/PC에서 동작.
function notify(count){
  try{
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    new Notification('나의 바다 — 새 응원 메시지', {
      body: `승인 대기 ${count}건이 있어요.`,
      tag: 'myocean-pending'
    });
  }catch(e){}
}

async function enableAlerts(){
  alertSoundOn = true;
  // 사용자 조작 시점에 오디오를 한 번 깨워둬야 이후 자동 재생이 허용됨
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
  }catch(e){}
  try{
    if('Notification' in window && Notification.permission === 'default'){
      await Notification.requestPermission();
    }
  }catch(e){}
  playChime(); // 테스트 삼아 한 번 울려서 잘 들리는지 확인
}

// 화면이 꺼지면 알림을 놓치므로, 관리 중에는 화면을 켜둘 수 있게 함
async function toggleWakeLock(btn){
  try{
    if(wakeLock){
      await wakeLock.release(); wakeLock = null;
      btn.classList.remove('on'); btn.textContent = '☀️ 화면 켜두기';
      return;
    }
    if(!('wakeLock' in navigator)){
      showToast('지원되지 않아요.', '이 브라우저는 화면 켜두기를 지원하지 않아요. 휴대폰 설정에서 화면 자동 꺼짐 시간을 늘려주세요.');
      return;
    }
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    btn.classList.add('on'); btn.textContent = '☀️ 화면 켜둠';
  }catch(e){
    showToast('화면 켜두기 실패', '배터리 절약 모드가 켜져 있으면 동작하지 않을 수 있어요.');
  }
}

// 승인 대기 메시지를 실시간 구독. 새 문서가 들어오면 알림.
function subscribeAdminAlerts(){
  if(adminUnsub) return;
  const q = query(collection(db, MESSAGES_COL), where('status','==','pending'));
  adminUnsub = onSnapshot(q, (snap)=>{
    const ids = snap.docs.map(d=>d.id);
    const count = ids.length;

    const dot = document.getElementById('pendingDot');
    if(dot) dot.textContent = String(count);
    document.title = count > 0 ? `(${count}) 나의 바다 — 관리자` : '나의 바다 — 관리자';

    if(knownPendingIds === null){
      knownPendingIds = new Set(ids); // 첫 로딩분은 알림 대상 아님
    }else{
      const fresh = ids.filter(id=>!knownPendingIds.has(id));
      if(fresh.length > 0){
        fresh.forEach(id=>newlyArrived.add(id));
        playChime();
        notify(count);
      }
      knownPendingIds = new Set(ids);
    }
    if(adminTab === 'pending') refreshAdmin();
  });
}
function unsubscribeAdminAlerts(){
  if(adminUnsub){ adminUnsub(); adminUnsub = null; }
  knownPendingIds = null;
  document.title = '나의 바다 — MY OCEAN';
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}

let adminTab = 'pending';

async function renderAdminPanel(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-title">관리자</div>
      <div class="admin-tabs">
        <button type="button" class="tab-btn" data-tab="pending">검수 대기</button>
        <button type="button" class="tab-btn" data-tab="all">전체 글 목록</button>
      </div>
      <div class="alert-bar" id="alertBar">
        <span>새 메시지 <span class="alert-dot" id="pendingDot">0</span></span>
        <button type="button" id="soundBtn">🔔 알림 켜기</button>
        <button type="button" id="awakeBtn">☀️ 화면 켜두기</button>
      </div>
      <div id="adminListBox">불러오는 중…</div>
      <footer style="margin-top:24px; display:flex; gap:16px; justify-content:center;">
        <a href="#" id="backLink">← 공개 화면으로</a>
        <a href="#" id="logoutLink">로그아웃</a>
      </footer>
    </div>
  `;
  document.getElementById('backLink').addEventListener('click', (e)=>{
    e.preventDefault();
    unsubscribeAdminAlerts();
    renderPublic();
  });
  document.getElementById('logoutLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    unsubscribeAdminAlerts();
    await signOut(auth);
    authReadyPromise = null;   // 다음 로그인 판정이 예전 결과를 재사용하지 않도록 초기화
    location.hash = '';        // 주소에 #admin이 남아 새로고침 시 관리자 화면으로 가는 것 방지
    renderPublic();
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      adminTab = btn.dataset.tab;
      refreshAdmin();
    });
  });

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', async ()=>{
    if(alertSoundOn){
      alertSoundOn = false;
      soundBtn.classList.remove('on'); soundBtn.textContent = '🔔 알림 켜기';
    }else{
      await enableAlerts();
      soundBtn.classList.add('on'); soundBtn.textContent = '🔔 알림 켜짐';
    }
  });
  const awakeBtn = document.getElementById('awakeBtn');
  awakeBtn.addEventListener('click', ()=> toggleWakeLock(awakeBtn));

  subscribeAdminAlerts();
  await refreshAdmin();
}

function statusLabel(status){
  if(status === 'approved') return '승인됨';
  if(status === 'rejected') return '거절됨';
  return '대기중';
}

async function refreshAdmin(){
  const box = document.getElementById('adminListBox');
  if(!box) return;

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === adminTab);
  });

  const list = await loadAllMessagesForAdmin();
  const items = adminTab === 'pending'
    ? list.filter(m=>m.status === 'pending').sort((a,b)=>a.ts-b.ts)
    : list.slice().sort((a,b)=>b.ts-a.ts);

  if(items.length === 0){
    box.innerHTML = `<div class="admin-empty">${adminTab==='pending' ? '대기 중인 메시지가 없어요.' : '등록된 메시지가 없어요.'}</div>`;
    return;
  }

  box.innerHTML = items.map(m=>`
    <div class="admin-item${newlyArrived.has(m.id) ? ' is-new' : ''}" data-id="${m.id}">
      <div class="meta">${escapeHtml(m.name)} · ${new Date(m.ts).toLocaleString('ko-KR')} · <span class="badge badge-${m.status}">${statusLabel(m.status)}</span></div>
      <div class="txt">${escapeHtml(m.text)}</div>
      <div class="admin-actions">
        ${m.status === 'pending' ? `
          <button class="btn-approve" data-act="approve">승인</button>
          <button class="btn-reject" data-act="reject">거절</button>
        ` : ''}
        <button class="btn-delete" data-act="delete">삭제</button>
      </div>
    </div>
  `).join('');

  box.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('.admin-item').dataset.id;
      const act = btn.dataset.act;

      if(act === 'delete'){
        showConfirm('정말 삭제할까요?', '삭제하면 되돌릴 수 없어요.', async ()=>{
          await removeMessage(id);
          await refreshAdmin();
        });
        return;
      }

      (async ()=>{
        await setMessageStatus(id, act === 'approve' ? 'approved' : 'rejected');
        await refreshAdmin();
      })();
    });
  });
}

async function route(){
  if(location.hash === '#admin') await renderAdmin();
  else await renderPublic();
}
window.addEventListener('hashchange', route);
route();

// 6초 폴링(setInterval) 제거됨.
// 이제 subscribeTank()의 실시간 리스너가 변경분만 받아 자동 반영하므로
// 주기적인 전체 재조회가 필요 없고, 읽기 할당량과 배터리 소모가 크게 줄어듦.

// 어항이 고정 폭(340px)에서 화면에 맞춰 늘어나는 유동 폭으로 바뀌었기 때문에,
// 기기를 회전하거나 창 크기를 바꾸면 예전 크기로 계산된 물고기가 어항 밖으로 나감.
// renderTank는 물고기를 만들 때 한 번만 어항 크기를 재므로, 크기가 바뀌면
// 기존 물고기를 지워 renderTank가 새 크기로 다시 계산하도록 함.
// (renderTank 자체는 수정하지 않고, 밖에서 다시 그리게만 유도)
let lastTankWidth = 0;
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    const layer = document.getElementById('notesLayer');
    if(!layer) return;
    const w = layer.getBoundingClientRect().width;
    if(w > 0 && Math.abs(w - lastTankWidth) > 12){
      lastTankWidth = w;
      layer.querySelectorAll('.fish').forEach(el=>el.remove());
      renderTank();
      if(tankModalEl) renderModalFish();
    }
  }, 250);
});
</script>
